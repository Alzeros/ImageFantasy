services:
  image-fantasy:
    build: .
    image: image-fantasy
    container_name: image-fantasy
    restart: unless-stopped
    ports:
      - "19150:19150"
    environment:
      - PORT=19150
      # 容器内必须监听 0.0.0.0，否则宿主机映射的端口连不上。
      # ⚠ 服务本身无鉴权，且 /api/providers 明文返回上游 API Key。
      #   若部署在公网服务器，请把 ports 改为 "127.0.0.1:19150:19150"
      #   并用 Nginx/Caddy 等反向代理加上鉴权后再对外暴露。
      - HOST=0.0.0.0
      - DATA_DIR=/data
    volumes:
      # 图库持久化：生成的图片与索引存在宿主机 ./data，重启不丢
      - ./data:/data
