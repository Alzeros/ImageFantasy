services:
  image-fantasy:
    build: .
    image: image-fantasy
    container_name: image-fantasy
    restart: unless-stopped
    ports:
      # 只监听服务器本机，由 HTTPS 反向代理（Caddy / Nginx）对外提供
      - "127.0.0.1:19150:19150"
    environment:
      - PORT=19150
      # 容器内必须监听 0.0.0.0，否则宿主机映射的端口连不上
      - HOST=0.0.0.0
      - DATA_DIR=/data
      # 对外访问地址；https 开头时登录 Cookie 只通过 HTTPS 发送
      # - PUBLIC_ORIGIN=https://img.example.com
      # 渠道密钥加密主密钥：强烈建议设置，并与 ./data 分开保管（如 .env）
      # - IMAGE_FANTASY_SECRET=${IMAGE_FANTASY_SECRET}
      # 反向代理经端口映射访问时，容器看到的来源是 Docker 网关，只采信这些地址转发的来源 IP
      - TRUSTED_PROXIES=172.16.0.0/12
    volumes:
      # 账号、渠道配置与图库都存在宿主机 ./data，重启不丢
      - ./data:/data
