<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图像工作室</title>
<style>
  :root{ --bg:#f5f7fa; --card:#fff; --line:#e4e8ee; --txt:#1f2329; --mut:#8a9099;
         --pri:#6d3bf5; --pri2:#5526d6; --ok:#16a34a; --err:#dc2626; --soft:#f1ecff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:21px;margin:0 0 2px}
  h2{font-size:15px;margin:0 0 12px}
  .sub{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
       color:var(--mut);font-size:12px;margin-bottom:18px}
  .svc{display:inline-flex;align-items:center;gap:6px}
  .svc i{width:8px;height:8px;border-radius:50%;background:#d1d5db;display:inline-block}
  .svc.ok i{background:var(--ok)}
  .svc.bad i{background:var(--err)}
  .svc.bad{color:var(--err)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
    background:#fff;color:var(--txt);font-size:13px;font-family:inherit}
  input[readonly]{background:#f7f8fa;color:var(--mut)}
  textarea{resize:vertical;min-height:76px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:8px 18px;cursor:pointer;font-size:13px;color:var(--mut);font-family:inherit}
  .seg button.on{background:var(--pri);color:#fff}
  .btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 24px;
    font-size:14px;cursor:pointer;font-weight:600;font-family:inherit}
  .btn:hover{background:var(--pri2)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
  .btn.ghost:hover{background:var(--soft)}
  .genbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
  .kbd{font-size:12px;color:var(--mut)}
  details{margin-top:6px}
  summary{cursor:pointer;color:var(--pri);font-size:13px;font-weight:600;user-select:none}
  .hint{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.6}
  .hide{display:none}
  .msg{font-size:13px;padding:11px 13px;border-radius:9px;margin-top:12px;white-space:pre-wrap;word-break:break-word}
  .msg.err{background:#fef2f2;color:var(--err);border:1px solid #fecaca}
  .msg.ok{background:#f0fdf4;color:var(--ok);border:1px solid #bbf7d0}
  .msg.info{background:var(--soft);color:var(--pri2);border:1px solid #ddd2ff}
  /* 参数区 */
  .prow{margin-top:14px}
  .prow:first-child{margin-top:0}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;
    font-size:13px;color:var(--mut);cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--pri);color:var(--pri)}
  .chip.on{border-color:var(--pri);background:var(--soft);color:var(--pri);font-weight:600}
  /* 上传缩略图 */
  .thumbs{display:flex;align-items:center;gap:8px;margin-top:8px}
  .thumbs img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .thumbs .fname{font-size:11px;color:var(--mut);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 状态条 */
  .status{margin-top:14px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px}
  .steps{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:10px}
  .step{padding:3px 10px;border:1px solid var(--line);border-radius:999px;transition:.15s}
  .step.doing{border-color:var(--pri);color:var(--pri);background:var(--soft);font-weight:600}
  .step.done{border-color:#bbe7c8;color:var(--ok);background:#f0fdf4}
  .step.err{border-color:#fecaca;color:var(--err);background:#fef2f2}
  .sline{display:flex;align-items:center;gap:9px;font-size:13px;flex-wrap:wrap}
  .spin{width:14px;height:14px;border:2px solid var(--soft);border-top-color:var(--pri);border-radius:50%;
    animation:sp .8s linear infinite;flex:0 0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  #stTimer{color:var(--mut);font-weight:600}
  /* 结果区 */
  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:12px}
  .rfigure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .rfigure img{width:100%;display:block;cursor:zoom-in}
  .rfigure .cap{padding:7px 10px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rfigure .cap a{color:var(--pri);text-decoration:none;font-weight:600}
  /* 图库 */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .gallery figure{margin:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fafbfc;position:relative}
  .gallery img{width:100%;display:block;cursor:zoom-in}
  .gallery figcaption{padding:8px 10px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .del{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:7px;
    padding:4px 9px;font-size:11px;cursor:pointer;opacity:0;transition:.15s}
  .gallery figure:hover .del{opacity:1}
  .empty{color:var(--mut);font-size:13px;padding:18px 0}
  .gcount{font-size:12px;color:var(--mut);font-weight:400;margin-left:8px}
  /* 灯箱 */
  .lb{position:fixed;inset:0;background:rgba(14,12,22,.86);display:flex;align-items:center;justify-content:center;z-index:50}
  .lb.hide{display:none}
  .lb img{max-width:92vw;max-height:80vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .lb .lbbar{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .lb .lbbar .name{color:rgba(255,255,255,.75);font-size:12px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb .lbbar a,.lb .lbbar button{background:rgba(255,255,255,.94);color:#333;padding:8px 14px;border-radius:9px;
    font-size:13px;font-weight:600;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
  .lb .lbbar a:hover,.lb .lbbar button:hover{background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h1>图像工作室</h1>
  <div class="sub">
    <span>自托管 · 兼容任意 OpenAI 风格图像接口 · 实时进度 · 点图看大图</span>
    <span id="svc" class="svc"><i></i>检测中…</span>
  </div>

  <div class="card">
    <div class="grid">
      <div><label>API Key（只存在浏览器里，不落盘）</label><input id="key" type="password" placeholder="sk-... 或你的代理 Key"></div>
      <div><label>Base URL（填到 /v1 为止）</label><input id="base" placeholder="你的接口地址，如 https://api.openai.com/v1"></div>
    </div>
    <div class="grid" style="margin-top:12px">
      <div><label>模型名（按你的渠道实际 ID 填）</label><input id="model" placeholder="按你的渠道填，如 gpt-image-1"></div>
      <div><label>模式</label>
        <div class="seg" id="modeSeg">
          <button data-m="generate" class="on">文生图</button>
          <button data-m="edit">参考图编辑</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <label>提示词 Prompt</label>
    <textarea id="prompt" placeholder="描述你想要的画面..."></textarea>
    <div id="editBox" class="hide" style="margin-top:12px">
      <div class="grid">
        <div><label>参考图（必填）</label><input id="imgFile" type="file" accept="image/*"><div id="imgThumb" class="thumbs"></div></div>
        <div><label>遮罩 mask（可选，透明区域被重绘）</label><input id="maskFile" type="file" accept="image/*"><div id="maskThumb" class="thumbs"></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>生成参数</h2>
    <div class="prow">
      <label>尺寸（越大越精细，也越慢）</label>
      <div class="chips" id="sizeChips">
        <button class="chip on" data-v="1024x1024">方形 1024×1024</button>
        <button class="chip" data-v="1024x1536">竖版 1024×1536</button>
        <button class="chip" data-v="1536x1024">横版 1536×1024</button>
        <button class="chip" data-v="2048x2048">高清 2048×2048</button>
        <button class="chip" data-v="custom">自定义…</button>
      </div>
      <div id="sizeCustomWrap" class="hide" style="margin-top:8px">
        <input id="p_size" value="1024x1024" placeholder="宽x高，32 的倍数，如 2048x1152">
      </div>
    </div>
    <div class="prow">
      <label>水印（是否生效取决于上游渠道）</label>
      <div class="chips" id="wmChips">
        <button class="chip on" data-v="off">无水印（推荐）</button>
        <button class="chip" data-v="on">带官方水印</button>
      </div>
    </div>
    <details style="margin-top:14px">
      <summary>高级参数（一般不用动）</summary>
      <div class="grid3" style="margin-top:12px">
        <div><label>n（生成张数；部分渠道仅支持 1）</label><input id="p_n" type="number" min="1" max="10" value="1"></div>
        <div><label>output_format（图片格式）</label>
          <select id="p_format"><option value="png" selected>png</option><option value="jpeg">jpeg</option><option value="webp">webp</option><option value="">— 不传 —</option></select>
        </div>
        <div><label>response_format（b64 更稳）</label>
          <select id="p_resp"><option value="b64_json" selected>b64_json</option><option value="url">url</option><option value="">— 不传 —</option></select>
        </div>
        <div><label>quality（兼容参数，可忽略）</label>
          <select id="p_quality"><option value="">— 不传 —</option><option>low</option><option>medium</option><option>high</option></select>
        </div>
        <div><label>style（兼容参数，可忽略）</label>
          <select id="p_style"><option value="">— 不传 —</option><option>vivid</option><option>natural</option></select>
        </div>
        <div><label>background（兼容参数，可忽略）</label>
          <select id="p_background"><option value="">— 不传 —</option><option>auto</option><option>transparent</option><option>opaque</option></select>
        </div>
        <div><label>output_compression（仅 jpeg/webp，0–100）</label>
          <input id="p_comp" type="number" min="0" max="100" placeholder="如 90">
        </div>
      </div>
      <div style="margin-top:12px">
        <label>额外参数（JSON，原样透传给上游，可塞任意专属字段）</label>
        <textarea id="p_extra" placeholder='例如：{ "seed": 42 }'></textarea>
      </div>
      <div class="hint">白话版：output_format=存成什么格式；response_format=上游用"链接"还是"直塞图片数据"（b64 更不容易丢图）；quality/style/background=GPT-Image 风格参数，部分渠道会忽略；留空 = 不发送该参数。</div>
    </details>
  </div>

  <div class="genbar">
    <button class="btn" id="go">生成图像</button>
    <button class="btn ghost hide" id="cancelBtn">取消等待</button>
    <span class="kbd">Ctrl / ⌘ + Enter 快捷生成</span>
  </div>

  <div id="status" class="status hide">
    <div class="steps" id="steps">
      <span class="step" data-s="1">1 · 提交请求</span>
      <span class="step" data-s="2">2 · 模型生成</span>
      <span class="step" data-s="3">3 · 保存到图库</span>
    </div>
    <div class="sline"><span class="spin" id="stSpin"></span><span id="stText">准备中…</span><b id="stTimer"></b></div>
  </div>

  <div id="res"></div>

  <div class="card" style="margin-top:18px">
    <h2>图库（服务端持久化）<span id="gcount" class="gcount"></span></h2>
    <div id="gallery" class="gallery"></div>
  </div>
</div>

<div id="lb" class="lb hide" onclick="if(event.target===this)closeLB()">
  <img id="lbImg" alt="">
  <div class="lbbar">
    <span class="name" id="lbName"></span>
    <a id="lbDl" href="#" download>下载</a>
    <a id="lbOpen" href="#" target="_blank" rel="noopener">原图</a>
    <button id="lbX">关闭 (Esc)</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let mode = 'generate';       // generate | edit
let sizeVal = '1024x1024';   // 当前尺寸（预设或自定义）
let wmVal = false;           // 是否加水印
let running = false, ctrl = null, t0 = 0, timerId = null;
const SIZE_PRESETS = ['1024x1024','1024x1536','1536x1024','2048x2048'];

/* ---------- 小工具 ---------- */
function showErr(msg){ $('res').innerHTML = '<div class="msg err">' + esc(msg) + '</div>'; }
function showInfo(msg){ $('res').innerHTML = '<div class="msg info">' + esc(msg) + '</div>'; }
function setText(s){ $('stText').textContent = s; }
function setSpin(on){ $('stSpin').style.visibility = on ? 'visible' : 'hidden'; }
function markStep(n, cls){
  const el = document.querySelector('#steps .step[data-s="' + n + '"]');
  if(!el) return;
  el.classList.remove('doing','done','err');
  if(cls) el.classList.add(cls);
}
function allSteps(cls){ [1,2,3].forEach(n => markStep(n, cls)); }
function resetSteps(){ [1,2,3].forEach(n => markStep(n, null)); }
function elapsedSec(){ return Math.max(0, Math.round((Date.now() - t0)/1000)); }
function startTimer(){
  t0 = Date.now(); $('stTimer').textContent = '已等待 0 秒';
  timerId = setInterval(() => { $('stTimer').textContent = '已等待 ' + elapsedSec() + ' 秒'; }, 500);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

/* ---------- chips ---------- */
function wireChips(sel, cb){
  document.querySelectorAll(sel + ' .chip').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(sel + ' .chip').forEach(b => b.classList.toggle('on', b === btn));
      cb(btn.dataset.v);
    };
  });
}
function selectChip(sel, val){
  const btn = document.querySelector(sel + ' .chip[data-v="' + val + '"]');
  if(btn) btn.click();
}
wireChips('#sizeChips', v => {
  const custom = v === 'custom';
  $('sizeCustomWrap').classList.toggle('hide', !custom);
  sizeVal = custom ? ($('p_size').value.trim() || '1024x1024') : v;
  saveCfg();
});
wireChips('#wmChips', v => { wmVal = (v === 'on'); saveCfg(); });
$('p_size').addEventListener('input', () => {
  if(!$('sizeCustomWrap').classList.contains('hide')) sizeVal = $('p_size').value.trim();
});

/* ---------- 本地配置持久化（不含 Key） ---------- */
const CFG_KEY = 'image-studio-cfg-v1';
function saveCfg(){
  const cfg = { base:$('base').value, model:$('model').value, prompt:$('prompt').value,
    size:sizeVal, wm:wmVal, n:$('p_n').value,
    format:$('p_format').value, resp:$('p_resp').value, quality:$('p_quality').value,
    style:$('p_style').value, bg:$('p_background').value, comp:$('p_comp').value };
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
}
function loadCfg(){
  let cfg = {};
  try{ cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); }catch(e){}
  if(cfg.base) $('base').value = cfg.base;
  if(cfg.model) $('model').value = cfg.model;
  if(cfg.prompt) $('prompt').value = cfg.prompt;
  ['format','resp','quality','style','bg','comp','n'].forEach(k => { if(cfg[k] !== undefined) $('p_' + k).value = cfg[k]; });
  if(cfg.size){
    if(SIZE_PRESETS.includes(cfg.size)){ selectChip('#sizeChips', cfg.size); }
    else { selectChip('#sizeChips', 'custom'); $('p_size').value = cfg.size; sizeVal = cfg.size; }
  }
  if(cfg.wm){ selectChip('#wmChips', 'on'); }
}
['base','model','prompt','p_format','p_resp','p_quality','p_style','p_background','p_comp','p_n'].forEach(id => {
  $(id).addEventListener('change', saveCfg);
});

/* ---------- 模式切换 ---------- */
document.querySelectorAll('#modeSeg button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#modeSeg button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); mode = b.dataset.m;
    $('editBox').classList.toggle('hide', mode !== 'edit');
    $('go').textContent = mode === 'edit' ? '编辑生成' : '生成图像';
  };
});

/* ---------- 上传缩略预览 ---------- */
function showThumb(input, boxId){
  const box = $(boxId); box.innerHTML = '';
  const f = input.files[0]; if(!f) return;
  const img = document.createElement('img'); img.src = URL.createObjectURL(f);
  const span = document.createElement('span'); span.className = 'fname'; span.textContent = f.name;
  box.appendChild(img); box.appendChild(span);
}
$('imgFile').addEventListener('change', () => showThumb($('imgFile'), 'imgThumb'));
$('maskFile').addEventListener('change', () => showThumb($('maskFile'), 'maskThumb'));

/* ---------- 服务探活 ---------- */
async function pingOnce(){
  try{
    const r = await fetch('/api/ping', { cache:'no-store', signal: AbortSignal.timeout(2500) });
    const d = await r.json();
    return !!d.ok;
  }catch(e){ return false; }
}
async function refreshSvc(){
  const ok = await pingOnce();
  const el = $('svc');
  el.className = 'svc ' + (ok ? 'ok' : 'bad');
  el.innerHTML = '<i></i>' + (ok ? '本地服务正常' : '本地服务未连接');
}

/* ---------- 灯箱 ---------- */
function openLB(url, name){
  $('lbImg').src = url;
  $('lbName').textContent = name || '';
  $('lbDl').href = url; $('lbDl').download = name || 'image.png';
  $('lbOpen').href = url;
  $('lb').classList.remove('hide');
}
function closeLB(){ $('lb').classList.add('hide'); $('lbImg').src = ''; }
$('lbX').onclick = closeLB;

/* ---------- 生成主流程 ---------- */
function buildPayload(){
  let extra = {};
  const ex = $('p_extra').value.trim();
  if(ex){ extra = JSON.parse(ex); }  // 出错由调用方捕获
  const size = $('sizeCustomWrap').classList.contains('hide') ? sizeVal : ($('p_size').value.trim() || '1024x1024');
  if(!/^\d{2,5}x\d{2,5}$/.test(size)) throw new Error('尺寸格式应为 宽x高，如 1024x1024');
  return {
    key: $('key').value.trim(),
    base: $('base').value.trim().replace(/\/+$/,''),
    model: $('model').value.trim() || 'gpt-image-1',
    mode,
    prompt: $('prompt').value,
    params: {
      size, n: Math.max(1, parseInt($('p_n').value, 10) || 1),
      output_format: $('p_format').value,
      response_format: $('p_resp').value,
      quality: $('p_quality').value,
      style: $('p_style').value,
      background: $('p_background').value,
      output_compression: $('p_comp').value,
      watermark: wmVal
    },
    extra
  };
}

function onEvent(ev){
  if(ev.stage === 'accepted'){ markStep(1,'done'); markStep(2,'doing'); setText('请求已送达服务器，正在调用上游模型…'); }
  else if(ev.stage === 'upstream'){ setText('模型生成中…（通常 10–60 秒，尺寸越大越慢）'); }
  else if(ev.stage === 'saving'){ markStep(2,'done'); markStep(3,'doing'); setText('上游已返回，正在保存到图库…'); }
}
function describeErr(ev){
  const m = (typeof ev.message === 'string') ? ev.message : JSON.stringify(ev.message);
  return (ev.http ? '（HTTP ' + ev.http + '）' : '') + m;
}
function fail(msg){
  stopTimer(); setSpin(false);
  const cur = document.querySelector('#steps .step.doing');
  if(cur){ cur.classList.remove('doing'); cur.classList.add('err'); }
  setText('出错了');
  showErr('生成失败：' + msg);
}
function success(ev){
  stopTimer(); setSpin(false);
  const items = ev.items || [];
  allSteps('done');
  setText('完成 ✓ 共 ' + items.length + ' 张 · 总用时 ' + elapsedSec() + ' 秒');
  renderResult(items);
  loadGallery();
}
function renderResult(items){
  const res = $('res');
  if(!items.length){ res.innerHTML = '<div class="msg err">上游返回为空，但没有报错——试试换个提示词或参数。</div>'; return; }
  const box = document.createElement('div'); box.className = 'results';
  items.forEach((it, i) => {
    const fig = document.createElement('figure'); fig.className = 'rfigure';
    const img = document.createElement('img'); img.src = it.url; img.alt = '生成结果'; img.title = '点击看大图';
    img.onclick = () => openLB(it.url, it.filename);
    const cap = document.createElement('div'); cap.className = 'cap';
    const meta = document.createElement('span');
    meta.textContent = [it.size || '', it.output_format || ''].filter(Boolean).join(' · ') || ('#' + (i + 1));
    const acts = document.createElement('span');
    const a1 = document.createElement('a'); a1.href = it.url; a1.download = it.filename || 'image.png'; a1.textContent = '下载';
    const a2 = document.createElement('a'); a2.href = it.url; a2.target = '_blank'; a2.rel = 'noopener'; a2.textContent = '原图';
    acts.append(a1, document.createTextNode(' · '), a2);
    cap.append(meta, acts);
    fig.append(img, cap); box.append(fig);
  });
  res.innerHTML = ''; res.appendChild(box);
  box.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

async function go(){
  if(running) return;
  const btn = $('go'), cancelBtn = $('cancelBtn');

  // ---- 前置校验 ----
  if(!$('key').value.trim()){ showErr('先填 API Key。'); $('key').focus(); return; }
  if(!$('base').value.trim()){ showErr('先填 Base URL（你的接口地址）。'); $('base').focus(); return; }
  if(!$('model').value.trim()){ showErr('先填模型名（按你的渠道）。'); $('model').focus(); return; }
  let payload;
  try{ payload = buildPayload(); }
  catch(e){ showErr(e.message.indexOf('JSON') >= 0 ? ('额外参数不是合法 JSON：' + e.message) : e.message); return; }
  if(mode === 'edit' && !$('imgFile').files[0]){ showErr('参考图编辑模式需要先选一张参考图。'); return; }

  // ---- 进入运行态 ----
  running = true;
  ctrl = new AbortController();
  btn.disabled = true; btn.textContent = '生成中…';
  cancelBtn.classList.remove('hide');
  $('res').innerHTML = '';
  $('status').classList.remove('hide');
  resetSteps(); allSteps(null);
  markStep(1, 'doing');
  setText('正在连接本地服务…');
  setSpin(true);
  startTimer();

  let doneEv = null, errEv = null, cancelled = false, netErr = null;
  try{
    // 参考图转 base64
    if(mode === 'edit'){
      setText('正在读取参考图…');
      payload.image = await fileToB64($('imgFile').files[0]);
      const mask = $('maskFile').files[0];
      if(mask) payload.mask = await fileToB64(mask);
    }

    // 探活：先确认本地服务在
    if(!await pingOnce()){
      fail('本地服务没有响应——server.py 还在运行吗？');
      return;
    }
    setText('已连接本地服务，正在提交生成请求…');

    const r = await fetch('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload), signal: ctrl.signal
    });
    if(!r.ok){
      let d = {}; try{ d = await r.json(); }catch(e){}
      const e = (d && (d.error || d.message)) || ('HTTP ' + r.status);
      fail(typeof e === 'string' ? e : JSON.stringify(e));
      return;
    }

    // 读 NDJSON 流，逐条处理阶段事件
    const reader = r.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';
    while(true){
      const { value, done } = await reader.read();
      if(done) break;
      buf += dec.decode(value, { stream:true });
      let idx;
      while((idx = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if(!line) continue;
        let ev = null; try{ ev = JSON.parse(line); }catch(_){ continue; }
        if(ev.stage === 'done') doneEv = ev;
        else if(ev.stage === 'error') errEv = ev;
        else onEvent(ev);
      }
    }
  }catch(e){
    if(e && e.name === 'AbortError') cancelled = true;
    else netErr = e;
  }finally{
    running = false; ctrl = null;
    btn.disabled = false; btn.textContent = mode === 'edit' ? '编辑生成' : '生成图像';
    cancelBtn.classList.add('hide');
  }

  // ---- 收尾判定 ----
  if(cancelled){
    stopTimer(); setSpin(false);
    const cur = document.querySelector('#steps .step.doing');
    if(cur){ cur.classList.remove('doing'); }
    setText('已取消等待');
    showInfo('已取消等待。注意：服务端可能仍会完成本次入库，过一会儿刷新图库看看。');
    setTimeout(loadGallery, 3000);
  }
  else if(netErr){
    fail('无法连接本地服务：' + netErr.message);
  }
  else if(errEv){
    fail(describeErr(errEv));
  }
  else if(doneEv){
    success(doneEv);
  }
  else{
    fail('连接在生成完成前中断了。若服务端实际已保存成功，刷新图库可见；否则重试一次。');
  }
}

function fileToB64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ---------- 图库 ---------- */
async function loadGallery(){
  const el = $('gallery');
  try{
    const r = await fetch('/api/gallery');
    const list = await r.json();
    el.innerHTML = '';
    $('gcount').textContent = list.length ? ('共 ' + list.length + ' 张') : '';
    if(!list.length){ el.innerHTML = '<div class="empty">还没有生成记录，去上面生一张吧。</div>'; return; }
    list.slice().reverse().forEach(it => {
      const fig = document.createElement('figure');
      const img = document.createElement('img'); img.src = it.url; img.alt = ''; img.title = '点击看大图';
      img.onclick = () => openLB(it.url, it.filename);
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '删除';
      del.onclick = (e) => { e.stopPropagation(); delItem(it.id); };
      const cap = document.createElement('figcaption');
      cap.textContent = (it.prompt || '(无提示词)').slice(0, 40) + (it.size ? (' · ' + it.size) : '');
      fig.append(img, del, cap);
      el.appendChild(fig);
    });
  }catch(e){ el.innerHTML = '<div class="empty">图库加载失败（本地服务还在吗）。</div>'; }
}
async function delItem(id){
  if(!confirm('删除这张图？')) return;
  await fetch('/api/gallery/' + encodeURIComponent(id), { method:'DELETE' });
  loadGallery();
}

/* ---------- 快捷键与初始化 ---------- */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeLB();
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !running) go();
});
$('go').onclick = go;
$('cancelBtn').onclick = () => { if(ctrl) ctrl.abort(); };

loadCfg();
refreshSvc();
setInterval(refreshSvc, 15000);
loadGallery();
</script>
